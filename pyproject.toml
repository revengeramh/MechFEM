[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechfem"
version = "0.1.0"
description = "An open-source Python framework for computational mechanics and finite element analysis"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0"
]

visualization = [
    "matplotlib>=3.7"
 ]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
